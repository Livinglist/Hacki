name: Update Flutter Version

# Bump Flutter to the newest stable tag in
# https://github.com/flutter/flutter/blob/master/CHANGELOG.md.
# Runs every day at 15:00 UTC, and can also be started by hand.
# Leave "flutter_version" empty to use that changelog tag, or set it
# to pin a specific version instead (bypasses the changelog check).
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      flutter_version:
        description: flutter version (leave empty for the latest changelog tag)
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-flutter-version
  cancel-in-progress: false

jobs:
  check:
    name: Check Flutter version
    runs-on: ubuntu-latest
    outputs:
      up_to_date: ${{ steps.compare.outputs.up_to_date }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compare pubspec.yaml with the requested Flutter version
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLUTTER_VERSION_INPUT: ${{ inputs.flutter_version }}
        run: |
          set -euo pipefail
          input="$(printf '%s' "${FLUTTER_VERSION_INPUT}" | tr -d '[:space:]')"
          input="${input#v}"
          input="${input#V}"

          if [ -n "${input}" ]; then
            changelog_version="${input}"
            echo "Using manually requested Flutter version ${changelog_version}."
          else
            changelog="$(curl -fsSL --retry 3 https://raw.githubusercontent.com/flutter/flutter/master/CHANGELOG.md)"
            changelog_version="$(printf '%s\n' "${changelog}" | grep -oE 'releases/tag/[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | sed 's|.*/||' || true)"
            if [ -z "${changelog_version}" ]; then
              changelog_version="$(printf '%s\n' "${changelog}" | grep -oE '^### \[[0-9]+\.[0-9]+\.[0-9]+\]' | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
            fi
          fi
          if ! [[ "${changelog_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine a target Flutter version." >&2
            exit 1
          fi

          pubspec_version="$(python3 - << 'PY'
          import re
          import sys
          from pathlib import Path

          text = Path("pubspec.yaml").read_text()
          pattern = re.compile(
              "^(\\s*flutter:\\s*[\"'])(\\d+\\.\\d+\\.\\d+)([\"'])\\s*$",
              re.MULTILINE,
          )
          match = pattern.search(text)
          if match is None:
              sys.exit("flutter pin not found in pubspec.yaml")
          print(match.group(2))
          PY
          )"

          echo "pubspec.yaml pins Flutter ${pubspec_version}; target is ${changelog_version}."
          if [ "${pubspec_version}" = "${changelog_version}" ]; then
            echo "up_to_date=true" >> "${GITHUB_OUTPUT}"
            echo "Flutter ${pubspec_version} already matches the target version." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          existing_pr="$(CHANGELOG_VERSION="${changelog_version}" python3 - << 'PY'
          import json
          import os
          import re
          import subprocess

          target = os.environ["CHANGELOG_VERSION"]
          pattern = re.compile(
              r"^chore(?:\(flutter\))?: bump Flutter version to (\d+\.\d+\.\d+)$"
          )
          prs = json.loads(
              subprocess.check_output(
                  [
                      "gh", "pr", "list",
                      "--state", "open",
                      "--limit", "100",
                      "--json", "number,title",
                  ],
                  text=True,
              )
          )
          for pr in prs:
              match = pattern.match(pr["title"].strip())
              if match and match.group(1) == target:
                  print(pr["number"])
                  break
          PY
          )"
          if [ -n "${existing_pr}" ]; then
            echo "up_to_date=true" >> "${GITHUB_OUTPUT}"
            echo "Pull request #${existing_pr} already bumps Flutter to ${changelog_version}." | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "up_to_date=false" >> "${GITHUB_OUTPUT}"
          fi

  update:
    name: Update Flutter version
    needs: check
    if: needs.check.outputs.up_to_date != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Resolve Flutter version
        id: flutter_version
        env:
          FLUTTER_VERSION_INPUT: ${{ inputs.flutter_version }}
        run: |
          set -euo pipefail
          input="$(printf '%s' "${FLUTTER_VERSION_INPUT}" | tr -d '[:space:]')"
          input="${input#v}"
          input="${input#V}"

          if [ -n "${input}" ]; then
            version="${input}"
          else
            changelog="$(curl -fsSL --retry 3 https://raw.githubusercontent.com/flutter/flutter/master/CHANGELOG.md)"
            version="$(printf '%s\n' "${changelog}" | grep -oE 'releases/tag/[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | sed 's|.*/||' || true)"
            if [ -z "${version}" ]; then
              version="$(printf '%s\n' "${changelog}" | grep -oE '^### \[[0-9]+\.[0-9]+\.[0-9]+\]' | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
            fi
          fi

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Flutter version: '${version:-}'" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Using Flutter ${version}"
          echo "### Flutter ${version}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Point submodules/flutter at the tag
        env:
          FLUTTER_VERSION: ${{ steps.flutter_version.outputs.version }}
        run: |
          set -euo pipefail
          # Drop the checkout credential header so this public fetch is anonymous.
          git -C submodules/flutter -c http.extraheader= fetch --depth 1 origin tag "${FLUTTER_VERSION}"
          git -C submodules/flutter checkout --detach "${FLUTTER_VERSION}"
          tagged="$(git -C submodules/flutter rev-parse "refs/tags/${FLUTTER_VERSION}^{}")"
          head="$(git -C submodules/flutter rev-parse HEAD)"
          if [ "${tagged}" != "${head}" ]; then
            echo "submodules/flutter HEAD ${head} does not match tag ${FLUTTER_VERSION} (${tagged})" >&2
            exit 1
          fi
          submodules/flutter/bin/flutter --version

      - name: Update pubspec.yaml
        env:
          FLUTTER_VERSION: ${{ steps.flutter_version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["FLUTTER_VERSION"]
          path = Path("pubspec.yaml")
          text = path.read_text()
          pattern = re.compile(
              "^(\\s*flutter:\\s*[\"'])(\\d+\\.\\d+\\.\\d+)([\"'])\\s*$",
              re.MULTILINE,
          )
          updated, count = pattern.subn(rf"\g<1>{version}\3", text, count=1)
          if count != 1:
              sys.exit(
                  f"expected to update 1 flutter pin in pubspec.yaml, updated {count}"
              )
          path.write_text(updated)
          PY

      - name: Flutter pub get
        run: submodules/flutter/bin/flutter pub get

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Expose CocoaPods from the iOS Gemfile
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          cat > "${RUNNER_TEMP}/bin/pod" << 'EOF'
          #!/bin/bash
          exec bundle exec pod "$@"
          EOF
          chmod +x "${RUNNER_TEMP}/bin/pod"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Configure iOS packages
        run: |
          set -euo pipefail
          pod --version
          submodules/flutter/bin/flutter build ios --config-only

      - name: Open pull request
        env:
          FLUTTER_VERSION: ${{ steps.flutter_version.outputs.version }}
          BASE_BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != "branch" ]; then
            echo "Run this workflow from a branch, not a tag." >&2
            exit 1
          fi

          git add -A -- pubspec.yaml pubspec.lock submodules/flutter

          mode="$(git ls-files -s -- submodules/flutter | awk '{print $1}')"
          if [ "${mode}" != "160000" ]; then
            echo "submodules/flutter was not staged as a gitlink (mode=${mode})" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Flutter ${FLUTTER_VERSION} did not change any tracked files."
            exit 0
          fi

          git diff --cached --stat

          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"

          git commit -m "$(cat <<EOF
          chore: bump Flutter version to ${FLUTTER_VERSION}

          EOF
          )"

          pacific_date="$(TZ=America/Los_Angeles date +%m%d%Y)"
          branch="chore/flutter-${FLUTTER_VERSION}-${pacific_date}"
          action_file="${RUNNER_TEMP}/flutter_pr_action"
          ACTION_FILE="${action_file}" BRANCH="${branch}" python3 - << 'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          target_text = os.environ["FLUTTER_VERSION"]
          target = tuple(int(part) for part in target_text.split("."))
          preferred_branch = os.environ["BRANCH"]
          title_pattern = re.compile(
              r"^chore(?:\(flutter\))?: bump Flutter version to (\d+\.\d+\.\d+)$"
          )

          def version_of(title):
              match = title_pattern.match(title.strip())
              if match is None:
                  return None
              return tuple(int(part) for part in match.group(1).split("."))

          prs = json.loads(
              subprocess.check_output(
                  [
                      "gh", "pr", "list",
                      "--state", "open",
                      "--limit", "100",
                      "--json", "number,title,headRefName",
                  ],
                  text=True,
              )
          )

          same, older, newer = [], [], []
          for pr in prs:
              version = version_of(pr["title"])
              if version is None:
                  continue
              if version == target:
                  same.append(pr)
              elif version < target:
                  older.append(pr)
              else:
                  newer.append(pr)

          for pr in older:
              old_version = ".".join(str(part) for part in version_of(pr["title"]))
              subprocess.check_call(
                  [
                      "gh", "pr", "close", str(pr["number"]),
                      "--comment",
                      (
                          f"Closing this pull request because Flutter {target_text} "
                          f"supersedes {old_version}."
                      ),
                  ]
              )
              print(
                  f"Closed outdated pull request #{pr['number']} (Flutter {old_version}).",
                  file=sys.stderr,
              )

          action_path = os.environ["ACTION_FILE"]
          if newer and not same:
              chosen = max(newer, key=lambda pr: version_of(pr["title"]))
              chosen_version = ".".join(str(part) for part in version_of(chosen["title"]))
              print(
                  f"Pull request #{chosen['number']} already bumps Flutter to {chosen_version}.",
                  file=sys.stderr,
              )
              open(action_path, "w").write("skip\n")
          elif same:
              print(
                  f"Pull request #{same[0]['number']} already bumps Flutter to {target_text}.",
                  file=sys.stderr,
              )
              open(action_path, "w").write(f"update {same[0]['headRefName']}\n")
          else:
              open(action_path, "w").write(f"create {preferred_branch}\n")
          PY

          action="$(tr -d '\n' < "${action_file}")"
          if [ "${action}" = "skip" ]; then
            exit 0
          fi
          branch="${action#* }"

          if git fetch --depth 1 origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
            git push --force-with-lease="refs/heads/${branch}:refs/remotes/origin/${branch}" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

          if [[ "${action}" == update\ * ]]; then
            echo "Updated the existing Flutter ${FLUTTER_VERSION} pull request."
            exit 0
          fi

          # GitHub's API can briefly lag behind a just-pushed ref, so retry
          # a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${branch}" \
              --title "chore(flutter): bump Flutter version to ${FLUTTER_VERSION}" \
              --body "$(cat <<EOF
          ## Summary
          - Pin Flutter \`${FLUTTER_VERSION}\` in \`pubspec.yaml\`.
          - Point \`submodules/flutter\` at tag \`${FLUTTER_VERSION}\`.
          - Refresh \`pubspec.lock\` with \`flutter pub get\`.

          EOF
          )"; then
              exit 0
            fi
            echo "gh pr create failed (attempt ${attempt}/5); retrying in 5s..." >&2
            sleep 5
          done
          echo "gh pr create failed after 5 attempts" >&2
          exit 1
