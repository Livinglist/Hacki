name: Update Flutter Version

# Manual Flutter bump. Leave "flutter version" empty to use the newest stable
# tag linked from https://github.com/flutter/flutter/blob/master/CHANGELOG.md.
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: flutter version (leave empty for the latest changelog tag)
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-flutter-version
  cancel-in-progress: false

jobs:
  update:
    name: Update Flutter version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Resolve Flutter version
        id: flutter_version
        env:
          FLUTTER_VERSION_INPUT: ${{ inputs.flutter_version }}
        run: |
          set -euo pipefail
          input="$(printf '%s' "${FLUTTER_VERSION_INPUT}" | tr -d '[:space:]')"
          input="${input#v}"
          input="${input#V}"

          if [ -n "${input}" ]; then
            version="${input}"
          else
            changelog="$(curl -fsSL --retry 3 https://raw.githubusercontent.com/flutter/flutter/master/CHANGELOG.md)"
            version="$(printf '%s\n' "${changelog}" | grep -oE 'releases/tag/[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | sed 's|.*/||' || true)"
            if [ -z "${version}" ]; then
              version="$(printf '%s\n' "${changelog}" | grep -oE '^### \[[0-9]+\.[0-9]+\.[0-9]+\]' | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
            fi
          fi

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Flutter version: '${version:-}'" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Using Flutter ${version}"
          echo "### Flutter ${version}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Point submodules/flutter at the tag
        env:
          FLUTTER_VERSION: ${{ steps.flutter_version.outputs.version }}
        run: |
          set -euo pipefail
          # Drop the checkout credential header so this public fetch is anonymous.
          git -C submodules/flutter -c http.extraheader= fetch --depth 1 origin tag "${FLUTTER_VERSION}"
          git -C submodules/flutter checkout --detach "${FLUTTER_VERSION}"
          tagged="$(git -C submodules/flutter rev-parse "refs/tags/${FLUTTER_VERSION}^{}")"
          head="$(git -C submodules/flutter rev-parse HEAD)"
          if [ "${tagged}" != "${head}" ]; then
            echo "submodules/flutter HEAD ${head} does not match tag ${FLUTTER_VERSION} (${tagged})" >&2
            exit 1
          fi
          submodules/flutter/bin/flutter --version

      - name: Update pubspec.yaml
        env:
          FLUTTER_VERSION: ${{ steps.flutter_version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["FLUTTER_VERSION"]
          path = Path("pubspec.yaml")
          text = path.read_text()
          pattern = re.compile(
              "^(\\s*flutter:\\s*[\"'])(\\d+\\.\\d+\\.\\d+)([\"'])\\s*$",
              re.MULTILINE,
          )
          updated, count = pattern.subn(rf"\g<1>{version}\3", text, count=1)
          if count != 1:
              sys.exit(
                  f"expected to update 1 flutter pin in pubspec.yaml, updated {count}"
              )
          path.write_text(updated)
          PY

      - name: Flutter pub get
        run: submodules/flutter/bin/flutter pub get

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ios
          bundler-cache: true

      - name: Expose CocoaPods from the iOS Gemfile
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          cat > "${RUNNER_TEMP}/bin/pod" << 'EOF'
          #!/bin/bash
          exec bundle exec pod "$@"
          EOF
          chmod +x "${RUNNER_TEMP}/bin/pod"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Configure iOS packages
        run: |
          set -euo pipefail
          pod --version
          submodules/flutter/bin/flutter build ios --config-only

      - name: Open pull request
        env:
          FLUTTER_VERSION: ${{ steps.flutter_version.outputs.version }}
          BASE_BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != "branch" ]; then
            echo "Run this workflow from a branch, not a tag." >&2
            exit 1
          fi

          git add -A -- pubspec.yaml pubspec.lock submodules/flutter ios
          git restore --staged -- ios/.bundle ios/vendor ios/bin 2>/dev/null || true

          mode="$(git ls-files -s -- submodules/flutter | awk '{print $1}')"
          if [ "${mode}" != "160000" ]; then
            echo "submodules/flutter was not staged as a gitlink (mode=${mode})" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Flutter ${FLUTTER_VERSION} did not change any tracked files."
            exit 0
          fi

          git diff --cached --stat

          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"

          git commit -m "$(cat <<EOF
          chore: bump Flutter version to ${FLUTTER_VERSION}

          EOF
          )"

          branch="chore/flutter-${FLUTTER_VERSION}"
          action_file="${RUNNER_TEMP}/flutter_pr_action"
          ACTION_FILE="${action_file}" BRANCH="${branch}" python3 - << 'PY'
          import json
          import os
          import subprocess
          import sys

          target_text = os.environ["FLUTTER_VERSION"]
          target = tuple(int(part) for part in target_text.split("."))
          preferred_branch = os.environ["BRANCH"]
          prefix = "chore: bump Flutter version to "

          def version_of(title):
              if not title.startswith(prefix):
                  return None
              raw = title[len(prefix):].strip()
              parts = raw.split(".")
              if len(parts) != 3 or not all(part.isdigit() for part in parts):
                  return None
              return tuple(int(part) for part in parts)

          prs = json.loads(
              subprocess.check_output(
                  [
                      "gh", "pr", "list",
                      "--state", "open",
                      "--limit", "100",
                      "--json", "number,title,headRefName",
                  ],
                  text=True,
              )
          )

          same, older, newer = [], [], []
          for pr in prs:
              version = version_of(pr["title"])
              if version is None:
                  continue
              if version == target:
                  same.append(pr)
              elif version < target:
                  older.append(pr)
              else:
                  newer.append(pr)

          for pr in older:
              old_version = ".".join(str(part) for part in version_of(pr["title"]))
              subprocess.check_call(
                  [
                      "gh", "pr", "close", str(pr["number"]),
                      "--comment",
                      (
                          f"Closing this pull request because Flutter {target_text} "
                          f"supersedes {old_version}."
                      ),
                  ]
              )
              print(
                  f"Closed outdated pull request #{pr['number']} (Flutter {old_version}).",
                  file=sys.stderr,
              )

          action_path = os.environ["ACTION_FILE"]
          if newer and not same:
              chosen = max(newer, key=lambda pr: version_of(pr["title"]))
              chosen_version = ".".join(str(part) for part in version_of(chosen["title"]))
              print(
                  f"Pull request #{chosen['number']} already bumps Flutter to {chosen_version}.",
                  file=sys.stderr,
              )
              open(action_path, "w").write("skip\n")
          elif same:
              print(
                  f"Pull request #{same[0]['number']} already bumps Flutter to {target_text}.",
                  file=sys.stderr,
              )
              open(action_path, "w").write(f"update {same[0]['headRefName']}\n")
          else:
              open(action_path, "w").write(f"create {preferred_branch}\n")
          PY

          action="$(tr -d '\n' < "${action_file}")"
          if [ "${action}" = "skip" ]; then
            exit 0
          fi
          branch="${action#* }"

          if git fetch --depth 1 origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
            git push --force-with-lease="refs/heads/${branch}:refs/remotes/origin/${branch}" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

          if [[ "${action}" == update\ * ]]; then
            echo "Updated the existing Flutter ${FLUTTER_VERSION} pull request."
            exit 0
          fi

          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${branch}" \
            --title "chore(flutter): bump Flutter version to ${FLUTTER_VERSION}" \
            --body "$(cat <<EOF
          ## Summary
          - Pin Flutter \`${FLUTTER_VERSION}\` in \`pubspec.yaml\`.
          - Point \`submodules/flutter\` at tag \`${FLUTTER_VERSION}\`.
          - Refresh \`pubspec.lock\` with \`flutter pub get\`.
          - Refresh tracked iOS package files with \`flutter build ios --config-only\`.

          EOF
          )"
