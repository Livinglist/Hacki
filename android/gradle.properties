org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
# Third-party plugins (e.g. receive_sharing_intent) mix Java 1.8 and Kotlin 18
# targets, which AGP flags as an error by default. Downgrade to a warning so
# the build proceeds.
kotlin.jvm.target.validation.mode=warning
